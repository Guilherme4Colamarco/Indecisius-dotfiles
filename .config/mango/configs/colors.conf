# Mango colors.conf (appearance)
# Gaps, cursor_size, overview settings are defined in decoration.conf and misc.conf (sourced later)

rootcolor=0x201b14ff
bordercolor=0x444444ff
focuscolor=0xc9b890ff
maximizescreencolor=0xc9b890ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff
borderpx=4
no_border_when_single=0
smartgaps=0
focused_opacity=1.0
unfocused_opacity=1.0

# Dynamic Matugen overrides, when generated by update-matugen-accent.sh.
source-optional=~/.config/mango/configs/colors.matugen.conf
